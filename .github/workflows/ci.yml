name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: pytest (CPU fallback)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # CPU torch wheel keeps the runner small and avoids triton install on CPU runners.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e .[test]

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Print package summary
        run: |
          python -c "import flagos_track1 as fg; print('flagos_track1', fg.__version__); print('exported ops:', [n for n in fg.__all__ if not n.isupper()])"
